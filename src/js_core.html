<script>
/**
 * SecCore — 断面図の解答の正規化と採点。
 *
 * GAS にもブラウザにも依存しない素の JS。tools/test_core.js から直接テストできる。
 *
 * 線分の正規化
 *   同じ直線でも「一気に引く」「小刻みに引く」で表現が変わってしまうと採点できない。
 *   そこですべての線分を「既約な刻み」（両成分の最大公約数で割った刻み）へ分解し、
 *   端点の順序も揃えてから集合として比較する。
 *   例: (0,0)-(0,5) → (0,0)-(0,1), (0,1)-(0,2), … の 5 本
 *       (2,9)-(6,13) → (2,9)-(3,10), … の 4 本
 */
var SecCore = (function () {

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = a % b; a = b; b = t; }
    return a;
  }

  /** 線分を既約な刻みへ分解する。 */
  function split(a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1];
    if (dx === 0 && dy === 0) return [];
    var g = gcd(dx, dy) || 1;
    var sx = dx / g, sy = dy / g, out = [];
    for (var i = 0; i < g; i++) {
      out.push([[a[0] + sx * i, a[1] + sy * i], [a[0] + sx * (i + 1), a[1] + sy * (i + 1)]]);
    }
    return out;
  }

  /** 端点の順序をそろえた、線分の位置キー。 */
  function segKey(a, b) {
    var p = a, q = b;
    if (p[0] > q[0] || (p[0] === q[0] && p[1] > q[1])) { p = b; q = a; }
    return p[0] + ',' + p[1] + ',' + q[0] + ',' + q[1];
  }

  function cellKey(c) { return c[0] + ',' + c[1]; }

  /** [[x1,y1],[x2,y2],kind] の配列 → Map(位置キー → 線種) */
  function normalizeLines(list) {
    var m = new Map();
    (list || []).forEach(function (seg) {
      var kind = seg[2] || 'outline';
      split(seg[0], seg[1]).forEach(function (u) {
        m.set(segKey(u[0], u[1]), kind);
      });
    });
    return m;
  }

  function normalizeHatch(list) {
    var s = new Set();
    (list || []).forEach(function (c) { s.add(cellKey(c)); });
    return s;
  }

  function keyToSeg(k) {
    var v = k.split(',').map(Number);
    return [[v[0], v[1]], [v[2], v[3]]];
  }

  function keyToCell(k) {
    var v = k.split(',').map(Number);
    return [v[0], v[1]];
  }

  /** 集合どうしの Jaccard 係数。両方が空なら 1（何も描かない問題は無いが安全弁）。 */
  function jaccard(inter, union) {
    return union === 0 ? 1 : inter / union;
  }

  function scoreLines(A, B) {
    var union = new Set();
    A.forEach(function (_, k) { union.add(k); });
    B.forEach(function (_, k) { union.add(k); });

    var inter = 0, missing = [], extra = [], wrongKind = [];
    union.forEach(function (k) {
      var a = A.get(k), b = B.get(k);
      if (a && b) {
        // 位置が合っていれば半分、線種まで合っていれば満点。
        if (a === b) inter += 1;
        else { inter += 0.5; wrongKind.push({ seg: keyToSeg(k), expected: a, actual: b }); }
      } else if (a) {
        missing.push(keyToSeg(k));
      } else {
        extra.push(keyToSeg(k));
      }
    });
    return { score: jaccard(inter, union.size), missing: missing, extra: extra, wrongKind: wrongKind };
  }

  function scoreHatch(A, B) {
    var union = new Set();
    A.forEach(function (k) { union.add(k); });
    B.forEach(function (k) { union.add(k); });

    var inter = 0, missing = [], extra = [];
    union.forEach(function (k) {
      var a = A.has(k), b = B.has(k);
      if (a && b) inter += 1;
      else if (a) missing.push(keyToCell(k));
      else extra.push(keyToCell(k));
    });
    return { score: jaccard(inter, union.size), missing: missing, extra: extra };
  }

  /** 典型誤答（traps）の判定。問題データ側で定義する。 */
  function checkTraps(problem, userLines, userHatch) {
    var hits = [];
    (problem.traps || []).forEach(function (t) {
      var hit = false;
      if (t.check === 'hatch-in-cells') {
        hit = (t.cells || []).some(function (c) { return userHatch.has(cellKey(c)); });
      } else if (t.check === 'line-of-kind') {
        userLines.forEach(function (kind) { if (kind === t.lineKind) hit = true; });
      } else if (t.check === 'segments-present') {
        hit = (t.segments || []).some(function (s) { return userLines.has(segKey(s[0], s[1])); });
      } else if (t.check === 'segments-missing') {
        hit = (t.segments || []).some(function (s) { return !userLines.has(segKey(s[0], s[1])); });
      } else if (t.check === 'hatch-missing-cells') {
        hit = (t.cells || []).every(function (c) { return !userHatch.has(cellKey(c)); });
      }
      if (hit) hits.push({ tag: t.tag, message: t.message, penalty: t.penalty || 0 });
    });
    return hits;
  }

  /** 汎用のフィードバック。traps に当たらなかったときの補助。 */
  function generalFeedback(ln, ht, userLines) {
    var out = [];
    if (ht.score === 0 && ht.missing.length > 0) {
      out.push({ tag: 'no-hatch', message: '切り口にはハッチングを施します。' });
    }
    if (ln.missing.length > ln.extra.length && ln.score < 0.8) {
      out.push({ tag: 'shape-missing', message: '線が足りません。切断面が通る部分をもう一度確認しましょう。' });
    }
    if (ln.extra.length > ln.missing.length && ln.score < 0.8) {
      out.push({ tag: 'shape-extra', message: '余分な線があります。切断面に現れない形を描いていないか確認しましょう。' });
    }
    if (ln.wrongKind.length > 0) {
      out.push({ tag: 'wrong-line-kind', message: '線種が違う線があります。切り口と見え掛かりの外形線は太い実線です。' });
    }
    return out;
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /**
   * 採点する。
   * @param {Object} problem 問題データ（answer.lines / answer.hatch / traps を持つ）
   * @param {Object} answer  {lines:[[[x,y],[x,y],kind]…], hatch:[[c,r]…]}
   */
  function grade(problem, answer) {
    var A  = normalizeLines(problem.answer.lines);
    var B  = normalizeLines(answer.lines);
    var Ah = normalizeHatch(problem.answer.hatch);
    var Bh = normalizeHatch(answer.hatch);

    var ln = scoreLines(A, B);
    var ht = scoreHatch(Ah, Bh);
    var traps = checkTraps(problem, B, Bh);

    var penalty = traps.reduce(function (s, t) { return s + t.penalty; }, 0);
    var raw = 60 * ln.score + 40 * ht.score - penalty;
    var score = Math.round(clamp(raw, 0, 100));

    var tol = (problem.answer.tolerance) || {};
    var passed = ln.score >= (tol.lineJaccard || 0.9)
              && ht.score >= (tol.hatchJaccard || 0.9)
              && traps.length === 0;

    var feedback = traps.slice();
    if (!passed && feedback.length === 0) {
      feedback = generalFeedback(ln, ht, B);
    }

    return {
      score: score,
      passed: passed,
      detail: {
        line: Math.round(ln.score * 1000) / 1000,
        hatch: Math.round(ht.score * 1000) / 1000,
        penalty: penalty
      },
      diff: {
        missingLines: ln.missing,
        extraLines: ln.extra,
        wrongKind: ln.wrongKind,
        missingHatch: ht.missing,
        extraHatch: ht.extra
      },
      feedback: feedback,
      tags: feedback.map(function (f) { return f.tag; })
    };
  }

  return {
    gcd: gcd,
    split: split,
    segKey: segKey,
    cellKey: cellKey,
    normalizeLines: normalizeLines,
    normalizeHatch: normalizeHatch,
    grade: grade
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = SecCore;
</script>
